name: Model check

# Loads the real Gemma 3 270M IT (q4) with the app's own ranking code and
# lists, and writes what it chose and how long each plan took to the job
# summary: in Node, then in headless Chromium on the CPU and on WebGPU, then
# again with no signal. Each plan is timed the old way (one full model run per
# answer) and the app's way (the prompt runs once and is reused).
on:
  push:
    branches: [main]
    paths:
      - 'src/model.js'
      - 'src/app.js'
      - 'src/lib/plan.js'
      - 'src/lib/rank.js'
      - 'src/model-worker.js'
      - 'src/index.html'
      - 'src/lib/model-info.js'
      - 'scripts/model-check.mjs'
      - 'scripts/smoke.mjs'
      - 'scripts/build.mjs'
      - 'scripts/probe-ort.mjs'
      - 'test/scenarios.mjs'
      - 'scripts/bench-page.js'
      - 'scripts/bench.html'
      - 'test/fixtures/ort/**'
      - 'package-lock.json'
      - '.github/workflows/model-check.yml'
  pull_request:
    paths:
      - 'src/model.js'
      - 'src/app.js'
      - 'src/lib/plan.js'
      - 'src/lib/rank.js'
      - 'src/model-worker.js'
      - 'src/index.html'
      - 'src/lib/model-info.js'
      - 'scripts/model-check.mjs'
      - 'scripts/smoke.mjs'
      - 'scripts/build.mjs'
      - 'scripts/probe-ort.mjs'
      - 'test/scenarios.mjs'
      - 'scripts/bench-page.js'
      - 'scripts/bench.html'
      - 'test/fixtures/ort/**'
      - 'package-lock.json'
      - '.github/workflows/model-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # With scripts: onnxruntime-node fetches its native binary here.
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-gemma-3-270m-it-q4-v1
      - name: Gemma in Node (same ranking code as the app)
        run: npm run model-check
      - name: Build the site, with the CI-only bench page
        env:
          BENCH: '1'
        run: npm run build
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Which runtime build runs the q4 operators (CPU and WebGPU)
        run: npm run probe-ort
      - name: Gemma in the browser on the CPU, then again with no signal
        timeout-minutes: 25
        env:
          MODEL: '1'
          BENCH_RUNS: 'full:2,shared:6'
        run: npm run smoke
      - name: Gemma in the browser on WebGPU (software GPU), then again with no signal
        timeout-minutes: 40
        env:
          MODEL: '1'
          MODEL_DEVICE: webgpu
          BENCH_RUNS: 'full:1,shared:2'
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-check
          path: |
            model-check.md
            docs/screenshot-model-*.png
          if-no-files-found: ignore
